- name: Marcel Vieira-Lara
  role: Assistant Professor
  category: Principal Investigator
  photo: Marcel.jpg
  optimized_photo: optimized/Marcel.jpg
  email: M.A.VieiraLara@tudelft.nl
  about: >-
    I was born and raised in the countryside of southern Minas Gerais, Brazil,
    where my family grew coffee and produced honey. Growing up surrounded by
    nature sparked my curiosity about life at the
    macroscopic scale. During my studies, that curiosity evolved into a desire
    to understand life at the cellular and molecular scales. I am fascinated by
    how cells conserve and allocate energy, and by the diversity of metabolic
    solutions found in nature. My work connects fundamental bioenergetics with
    quantitative physiology and mitochondrial engineering, addressing
    fundamental questions while enabling applications in biotechnology. I value
    curiosity, collaboration, open communication and an environment that
    welcomes new ideas. I aim to cultivate an open and collaborative scientific
    environment where curiosity is encouraged, different perspectives are
    valued and people feel free to be themselves.
  education:
    - Postdoc Industrial Microbiology, TU Delft, The Netherlands
    - Ph.D. Systems Biology, University of Groningen, The Netherlands
    - M.Sc. Molecular Medicine, University of Groningen, The Netherlands
    - B.Sc. Molecular Sciences, University of São Paulo, Brazil
