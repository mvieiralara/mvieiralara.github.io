- number: "I"
  title: Bioenergetics
  icon: fa-bolt
  image: ETC.png
  image_alt: Electron transport chain model
  description: >-
    We investigate how living systems capture, conserve and spend energy.
    Our work spans respiratory chains, F<sub>o</sub>F<sub>1</sub> ATP synthase, mitochondrial physiology
    and ATP economy in yeast and animal cells.

- number: "II"
  title: Quantitative Physiology
  icon: fa-chart-line
  image: Bioreactor.jpeg
  optimized_image: optimized/Bioreactor.jpeg
  image_alt: Laboratory bioreactor used for quantitative physiology
  description: >-
    We quantify how yeast and animal cells distribute resources and energy
    according to culture conditions and alternative feedstocks. Through
    controlled cultivation, off-gas analysis, and analytical, quantitative
    analyses, we identify the principles behind cellular rates, yields and
    trade-offs.

- number: "III"
  title: Mitochondrial Engineering
  icon: fa-dna
  image: bioengineering.png
  image_alt: Mitochondrial engineering through mitochondrial and nuclear genomes
  description: >-
    We engineer mitochondrial function to understand energy metabolism and
    design more efficient cells and processes. Our work includes mtDNA editing
    in <em>Saccharomyces cerevisiae</em>, and engineering nuclear-encoded
    mitochondrial proteins in yeasts and animal cells.
